[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-smart-retail"
version = "0.1.0"
description = "General-purpose retail management and reporting foundation"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
ignore = ["FURB157"]
target-version = "py311"
